<body class="bg-background text-on-background min-h-screen flex flex-col font-body-lg">
<!-- TopAppBar -->
<header class="docked full-width top-0 bg-surface dark:bg-surface-dim shadow-sm z-50 transition-colors duration-200">
<div class="flex justify-between items-center px-margin-mobile md:px-margin-desktop py-4 w-full max-w-[800px] mx-auto">
<button aria-label="Language options" class="flex items-center justify-center p-2 rounded-full hover:bg-surface-container-low transition-colors duration-200 text-primary dark:text-primary-fixed-dim">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">language</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary dark:text-primary-fixed-dim tracking-tight">Kisaan Marg</h1>
<button aria-label="Toggle Language" class="flex items-center justify-center px-4 py-2 rounded-full font-label-lg text-label-lg hover:bg-surface-container-low transition-colors duration-200 text-primary dark:text-primary-fixed-dim">हिंदी <span class="material-symbols-outlined ml-1 text-[18px]">arrow_drop_down</span></button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-gutter pt-section-gap pb-[120px] max-w-[800px] mx-auto w-full relative">
<!-- Progress Indicator -->
<div class="w-full max-w-md mb-8 flex justify-between items-center gap-2">
<div class="h-2 flex-1 bg-secondary rounded-full"></div>
<div class="h-2 flex-1 bg-secondary rounded-full"></div>
</div>
<!-- Question Section -->
<div class="w-full bg-surface-container-lowest rounded-xl p-6 shadow-sm border border-surface-container mb-stack-gap text-center relative overflow-hidden">
<!-- Background Texture Hint -->
<div class="absolute inset-0 opacity-5 pointer-events-none" style="background-image: repeating-linear-gradient(45deg, #00450d 0, #00450d 1px, transparent 0, transparent 50%); background-size: 10px 10px;"></div>
<div class="relative z-10">
<button aria-label="Play question audio" class="mb-4 w-16 h-16 rounded-full bg-surface-container flex items-center justify-center mx-auto hover:bg-surface-container-high transition-colors shadow-sm">
<span class="material-symbols-outlined text-4xl text-primary" style="font-variation-settings: 'FILL' 1;">volume_up</span>
</button>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-xl md:text-headline-xl text-on-surface mb-2">आपके पास कितने किलो टमाटर हैं?</h2>
<p class="font-body-xl text-body-xl text-on-surface-variant">How many kilos of tomatoes do you have?</p>
</div>
</div>
<!-- Input Section -->
<div class="w-full max-w-md flex flex-col items-center gap-stack-gap mt-8">
<!-- Visual Confirmation Area -->
<div class="w-full bg-surface-container-lowest border-2 border-outline-variant rounded-xl p-4 flex items-center justify-between shadow-sm min-h-[80px]">
<span class="font-body-xl text-body-xl text-outline italic">यहाँ मात्रा दिखाई देगी... (Quantity will appear here...)</span>
<!-- Hidden input for form submission if needed -->
<input id="quantityInput" name="quantity" type="hidden">
</div>
<!-- Contextual Chips -->
<div class="flex flex-wrap justify-center gap-4 w-full mt-4"><button class="bg-primary-container text-on-primary-container border border-primary rounded-full px-6 py-3 flex items-center gap-2 shadow-sm hover:bg-primary hover:text-on-primary active:scale-95 transition-all w-full justify-center mb-2">
<span class="material-symbols-outlined">mic</span>
<span class="font-label-lg">मात्रा बोलकर बताएं</span>
</button>
<button class="bg-surface-container-lowest border border-outline-variant rounded-full px-6 py-3 flex items-center gap-2 shadow-sm hover:bg-surface-container-high active:scale-95 transition-all text-on-surface">
<span class="font-body-xl text-body-xl">50 Kg</span>
</button>
<button class="bg-surface-container-lowest border border-outline-variant rounded-full px-6 py-3 flex items-center gap-2 shadow-sm hover:bg-surface-container-high active:scale-95 transition-all text-on-surface">
<span class="font-body-xl text-body-xl">100 Kg</span>
</button>
<button class="bg-surface-container-lowest border border-outline-variant rounded-full px-6 py-3 flex items-center gap-2 shadow-sm hover:bg-surface-container-high active:scale-95 transition-all text-on-surface">
<span class="font-body-xl text-body-xl">500 Kg</span>
</button>
</div>
<!-- Primary Microphone Action (Ergonomically placed in bottom third) -->
<div class="mt-12 mb-8 relative flex justify-center w-full">
<button aria-label="Tap to speak quantity" class="w-24 h-24 rounded-full bg-primary text-on-primary shadow-[0_4px_20px_rgba(255,152,0,0.2)] flex items-center justify-center transition-transform hover:scale-105 active:scale-95 z-20" id="mainMicBtn">
<span class="material-symbols-outlined text-5xl" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-24 h-24 rounded-full border-4 border-[#FF9800] opacity-0 z-10 pointer-events-none" id="micIndicator"></div>
<!-- Helper text -->
<div class="absolute -bottom-10 left-1/2 -translate-x-1/2 whitespace-nowrap text-on-surface-variant font-label-lg text-label-lg">
                    Tap to speak
                </div>
</div>
</div>
</main>
<!-- Bottom Navigation / Footer Area (Suppressed global nav for transactional flow) -->
<footer class="fixed bottom-0 w-full bg-surface border-t border-surface-container p-4 pb-safe flex justify-between items-center z-40 shadow-[0_-2px_10px_rgba(0,0,0,0.05)]">
<button aria-label="Go back" class="flex items-center gap-2 text-primary px-4 py-2 rounded-lg hover:bg-surface-container-low transition-colors font-label-lg text-label-lg">
<span class="material-symbols-outlined">arrow_back</span>
            Back
         </button>
<div class="font-label-lg text-label-lg text-on-surface-variant bg-surface-container px-4 py-2 rounded-full">
             Step 2 of 2
         </div>
<button aria-label="Confirm quantity" class="bg-primary text-on-primary px-6 py-3 rounded-lg font-label-lg text-label-lg shadow-sm hover:bg-primary-container transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2" disabled="">
             Next
             <span class="material-symbols-outlined">arrow_forward</span>
</button>
</footer>
<script>
        // Simple micro-interaction for the microphone button
        const micBtn = document.getElementById('mainMicBtn');
        const micIndicator = document.getElementById('micIndicator');
        let isListening = false;

        micBtn.addEventListener('click', () => {
            isListening = !isListening;
            
            if (isListening) {
                // Active state
                micBtn.classList.remove('bg-primary');
                micBtn.classList.add('bg-[#FF9800]', 'mic-pulse');
                micBtn.setAttribute('aria-label', 'Listening...');
                
                // Haptic feedback if supported
                if (navigator.vibrate) {
                    navigator.vibrate(50);
                }
            } else {
                // Inactive state
                micBtn.classList.add('bg-primary');
                micBtn.classList.remove('bg-[#FF9800]', 'mic-pulse');
                micBtn.setAttribute('aria-label', 'Tap to speak quantity');
            }
        });
    </script>
