<!-- Navigation Suppressed for this transactional step -->
<!-- BottomNavBar intentionally excluded per 'Shell Visibility & Relevance' rules -->
<script>
        // Simple JS for Mic button interaction
        const micBtn = document.getElementById('mic-btn');
        const micRing = document.getElementById('mic-ring');
        let isListening = false;

        micBtn.addEventListener('click', () => {
            isListening = !isListening;
            if (isListening) {
                micRing.classList.add('mic-pulse');
                micBtn.classList.replace('bg-primary-container', 'bg-[#FF9800]');
                micBtn.classList.replace('text-on-primary', 'text-white');
            } else {
                micRing.classList.remove('mic-pulse');
                micBtn.classList.replace('bg-[#FF9800]', 'bg-primary-container');
                micBtn.classList.replace('text-white', 'text-on-primary');
            }
        });
    </script>
