<style>
        .pulse-animation {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 152, 0, 0.4); }
            70% { box-shadow: 0 0 0 16px rgba(255, 152, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 152, 0, 0); }
        }
        .waveform-bar {
            animation: wave 1s infinite alternate;
        }
        .waveform-bar:nth-child(2) { animation-delay: 0.1s; }
        .waveform-bar:nth-child(3) { animation-delay: 0.2s; }
        .waveform-bar:nth-child(4) { animation-delay: 0.3s; }
        .waveform-bar:nth-child(5) { animation-delay: 0.4s; }
        @keyframes wave {
            0% { transform: scaleY(0.5); }

    </style>

<script>
        // Simple script to toggle waveform animation state on play button click
        document.addEventListener('DOMContentLoaded', () => {
            const playBtn = document.querySelector('button[aria-label="Play advice"]');
            const bars = document.querySelectorAll('.waveform-bar');
            let isPlaying = true; // Start playing conceptually

            playBtn.addEventListener('click', () => {
                const icon = playBtn.querySelector('span');
                isPlaying = !isPlaying;
                
                if (isPlaying) {
                    icon.textContent = 'pause';
                    icon.setAttribute('data-icon', 'pause');
                    bars.forEach(bar => bar.style.animationPlayState = 'running');
                } else {
                    icon.textContent = 'play_arrow';
                    icon.setAttribute('data-icon', 'play_arrow');
                    bars.forEach(bar => bar.style.animationPlayState = 'paused');
                }
            });
        });
    </script>
